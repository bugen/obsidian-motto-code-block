name: Release Obsidian plugin

on:
  push:
    tags:
      - '*.*.*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    defaults:
      run:
        shell: bash
    env:
      RELEASE_TAG: ${{ github.ref_name }}

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Validate release version
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';

          const tag = process.env.RELEASE_TAG;
          assert.match(tag ?? '', /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/,
            'Release tags must use x.y.z without a v prefix.');
          for (const file of ['manifest.json', 'package.json']) {
            const { version } = JSON.parse(readFileSync(file, 'utf8'));
            assert.equal(version, tag, `The release tag must match the version in ${file}.`);
          }
          console.log(`Validated release ${tag}.`);
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Type-check tests
        run: npx --no-install tsc --noEmit -p tsconfig.test.json

      - name: Build plugin
        run: npm run build

      - name: Verify release assets
        run: |
          for asset in main.js manifest.json styles.css; do
            if [[ ! -s "$asset" ]]; then
              echo "::error file=$asset::Release asset is missing or empty."
              exit 1
            fi
          done

      - name: Attest release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --draft \
            --title "$RELEASE_TAG" \
            --generate-notes \
            main.js manifest.json styles.css
